kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# The head of the version; CI appends the run number through -PVERSION.
version=0.1.0

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.vojak
sborka.repository=youndie/vojak
sborka.description=Leader election and a distributed lock for Kotlin/Native and JVM services, on the Postgres they already have.
sborka.inceptionYear=2026

# The oldest Java a consumer may be on. vojak runs inside whatever service elects a leader, so it
# follows the portfolio's floor rather than the newest JDK the build happens to have.
sborka.jvmToolchain=21
sborka.jvmFloor=21

# ON from the first line: a library, and the cheapest moment to be explicit about its surface is
# before it has one.
sborka.explicitApi=true

# Maven Central, as the shared publishing contract does it. vojak-kore must not reach Central while
# kore is not there (research D8) — how it is kept off is B-12's to settle, not this file's.
sborka.central=true
